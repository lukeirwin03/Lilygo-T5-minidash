[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
# Ports auto-detected; override per-host in platformio.ini or via --upload-port.
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps = 
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

# Left-hand device: identical firmware, panel image rotated 180°
# (setRotation(3)) for devices mounted flipped on the desk's left side.
# Flashed via ./flash.sh --hand left  (or: pio run -e esp32dev_left -t upload).
[env:esp32dev_left]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DHAND_ROTATION=3

# Single-dashboard builds — each desk device carries only its designated
# dashboard. Selected via ./flash.sh --dash <name> [--hand left|right].
[env:esp32dev_weather]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_TEST=0

[env:esp32dev_weather_left]
extends = env:esp32dev_left
build_flags =
    ${env:esp32dev_left.build_flags}
    -DENABLE_TEST=0

[env:esp32dev_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_WEATHER=0

[env:esp32dev_test_left]
extends = env:esp32dev_left
build_flags =
    ${env:esp32dev_left.build_flags}
    -DENABLE_WEATHER=0

[env:native]
platform = native
build_flags = -std=c++14
build_src_filter = -<*>      # exclude all firmware src — tests + pure.h only
test_framework = unity
