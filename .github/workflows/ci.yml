name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      # config.h #includes secrets.h, so the build requires the file to
      # exist. CI copies the committed example values (placeholder SSID,
      # nullptr MQTT auth) over it — no real credentials ever enter CI.
      - name: Provide stub secrets (CI never sees real credentials)
        run: cp include/secrets.example.h include/secrets.h

      - name: Build firmware
        run: pio run -e esp32dev -e esp32dev_left -e esp32dev_weather -e esp32dev_weather_left -e esp32dev_test -e esp32dev_test_left

      - name: Native unit tests
        run: pio test -e native
